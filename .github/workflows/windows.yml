name: Windows x86-64

on:
  workflow_dispatch:
    inputs:
      full_catalog:
        description: Download and test every catalog model variant
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - name: Configure and test
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --parallel 2
          ctest --test-dir build/linux --output-on-failure

  windows:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.363.0'
          $filename = "vulkansdk-windows-X64-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP $filename
          $sdk = "C:\VulkanSDK\$version"
          $expected = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/$filename" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Vulkan SDK hash mismatch' }
          $process = Start-Process $installer -ArgumentList @('--root', $sdk, '--accept-licenses',
            '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$sdk\Bin\glslc.exe")) { throw 'Vulkan SDK installation failed' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "XSL_WINDOWS_BUILD=$env:RUNNER_TEMP\xv" >> $env:GITHUB_ENV
      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B $env:XSL_WINDOWS_BUILD -G 'Visual Studio 17 2022' -A x64 -DXSL_VULKAN=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $env:XSL_WINDOWS_BUILD --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir $env:XSL_WINDOWS_BUILD -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Assemble and inspect native package
        shell: pwsh
        env:
          XSL_FULL_CATALOG: ${{ inputs.full_catalog }}
        run: |
          $installLog = Join-Path $env:RUNNER_TEMP 'xsl-install.log'
          cmake --install $env:XSL_WINDOWS_BUILD --config Release --prefix dist/stage --component xsl 2>&1 |
            Tee-Object -FilePath $installLog
          if ($LASTEXITCODE) {
            Get-Content -LiteralPath $installLog -Tail 8 | ForEach-Object { Write-Output ('::error::' + $_) }
            exit $LASTEXITCODE
          }
          try {
            .\cmake\package-windows.ps1 -RequireVulkan -FullCatalog:($env:XSL_FULL_CATALOG -eq 'true')
          } catch {
            Write-Output ('::error::' + ($_.Exception.Message -replace '\r?\n', '%0A'))
            exit 1
          }

      - name: Upload installable archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: X-Speech-Listen-Windows-x86-64
          path: |
            dist/X-Speech-Listen-Windows-x86-64.zip
            dist/X-Speech-Listen-Windows-x86-64.zip.sha256
          if-no-files-found: error
