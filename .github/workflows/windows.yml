name: Windows x86-64 preview

on:
  workflow_dispatch:
  push:
    branches: ['main', 'xvr/windows-preview']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - name: Configure and test
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --parallel 2
          ctest --test-dir build/linux --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/windows --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Assemble and inspect native package
        shell: pwsh
        run: |
          cmake --install build/windows --config Release --prefix dist/stage --component xvr
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\cmake\package-windows.ps1

      - name: Upload installable archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: X-Voice-Rekon-Windows-x86-64
          path: |
            dist/X-Voice-Rekon-Windows-x86-64.zip
            dist/X-Voice-Rekon-Windows-x86-64.zip.sha256
          if-no-files-found: error
