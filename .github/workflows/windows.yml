name: Windows x86-64 preview

on:
  workflow_dispatch:
    inputs:
      full_catalog:
        description: Download and test every catalog model variant
        type: boolean
        default: false
      moonshine_voice:
        description: Test Moonshine Voice Small and Medium on Windows
        type: boolean
        default: false
  push:
    branches: ['main', '*/windows-preview', 'dev/moonshine-voice']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev
      - name: Configure and test
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux --parallel 2
          ctest --test-dir build/linux --output-on-failure

  windows:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.363.0'
          $filename = "vulkansdk-windows-X64-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP $filename
          $sdk = "C:\VulkanSDK\$version"
          $expected = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/$filename" -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $expected) { throw 'Vulkan SDK hash mismatch' }
          $process = Start-Process $installer -ArgumentList @('--root', $sdk, '--accept-licenses',
            '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$sdk\Bin\glslc.exe")) { throw 'Vulkan SDK installation failed' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          "XSR_WINDOWS_BUILD=$env:RUNNER_TEMP\xv" >> $env:GITHUB_ENV
      - name: Configure, build and test
        shell: pwsh
        run: |
          cmake -S . -B $env:XSR_WINDOWS_BUILD -G 'Visual Studio 17 2022' -A x64 -DXSR_VULKAN=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build $env:XSR_WINDOWS_BUILD --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir $env:XSR_WINDOWS_BUILD -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Assemble and inspect native package
        shell: pwsh
        env:
          XSR_FULL_CATALOG: ${{ inputs.full_catalog }}
        run: |
          cmake --install $env:XSR_WINDOWS_BUILD --config Release --prefix dist/stage --component xsr
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          .\cmake\package-windows.ps1 -RequireVulkan -FullCatalog:($env:XSR_FULL_CATALOG -eq 'true')

      - name: Upload installable archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: X-Speech-Rekon-Windows-x86-64
          path: |
            dist/X-Speech-Rekon-Windows-x86-64.zip
            dist/X-Speech-Rekon-Windows-x86-64.zip.sha256
          if-no-files-found: error

  moonshine-windows:
    if: ${{ github.ref_name == 'dev/moonshine-voice' || (github.event_name == 'workflow_dispatch' && inputs.moonshine_voice) }}
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with the official Moonshine SDK
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'moonshine.tar.gz'
          $sdk = Join-Path $env:RUNNER_TEMP 'moonshine-voice-windows-x86_64'
          $expected = '9e33fa88c1dd627314072ffe005af94888515c534cc599617462bc72ed3770f3'
          Invoke-WebRequest -Uri 'https://github.com/moonshine-ai/moonshine/releases/download/v0.1.6/moonshine-voice-windows-x86_64.tar.gz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) { throw 'Moonshine SDK hash mismatch' }
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build/moonshine -G 'Visual Studio 17 2022' -A x64 "-DXSR_MOONSHINE_SDK=$sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/moonshine --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/moonshine -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test official weights with a WAV and simulated PTT
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Essai Moonshine'
          cmake --install build/moonshine --config Release --prefix $stage --component xsr
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $engine = Join-Path $stage 'X-Speech-Rekon/bin/xsr-engine.exe'
          $check = Join-Path $stage 'tools/xsr-check.exe'
          $wav = Join-Path $stage 'X-Speech-Rekon/test-en.wav'
          $models = Join-Path $env:RUNNER_TEMP 'Modèles Moonshine'
          & $check --engine $engine --catalog assets/moonshine-catalog.json --models $models --fetch --wav $wav
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
